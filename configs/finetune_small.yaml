# Fase 2: fine-tune no EMOPIA+ (emoção por quadrante + curvas), a partir do pré-treino.
name: finetune_small
init_from: outputs/runs/pretrain_small/best.pt

data:
  train: train
  val: val

model:                 # tem que ser igual ao do pré-treino
  max_len: 512
  d_model: 256
  n_layers: 4
  n_heads: 4
  d_ff: 1024
  dropout: 0.1
  tie_weights: true

train:
  stride: 256
  batch_size: 64
  lr: 1.0e-4
  min_lr_ratio: 0.1
  weight_decay: 0.1
  betas: [0.9, 0.95]
  warmup_steps: 100
  max_epochs: 20
  patience: 3
  grad_clip: 1.0
  num_workers: 4
