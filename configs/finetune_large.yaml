# Fase 2: fine-tune no EMOPIA+ (emoção por quadrante + curvas), a partir do pré-treino.
name: finetune_large
init_from: outputs/runs/pretrain_large/best.pt

data:
  train: train
  val: val

model:                 # tem que ser igual ao do pré-treino
  max_len: 1024
  d_model: 512
  n_layers: 6
  n_heads: 8
  d_ff: 2048
  dropout: 0.1
  tie_weights: true

train:
  stride: 512
  batch_size: 32
  lr: 1.0e-4
  min_lr_ratio: 0.1
  weight_decay: 0.1
  betas: [0.9, 0.95]
  warmup_steps: 100
  max_epochs: 20
  patience: 3
  grad_clip: 1.0
  num_workers: 4
