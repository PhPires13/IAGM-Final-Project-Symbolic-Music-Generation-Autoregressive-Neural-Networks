# Ablação: modelo pequeno treinado do zero só no EMOPIA+ (sem pré-treino).
name: scratch_small

model:
  max_len: 512
  d_model: 256
  n_layers: 4
  n_heads: 4
  d_ff: 1024
  dropout: 0.1
  tie_weights: true

train:
  stride: 256
  batch_size: 64
  lr: 5.0e-4
  min_lr_ratio: 0.1
  weight_decay: 0.1
  betas: [0.9, 0.95]
  warmup_steps: 500
  max_epochs: 40
  patience: 5
  grad_clip: 1.0
  num_workers: 4
