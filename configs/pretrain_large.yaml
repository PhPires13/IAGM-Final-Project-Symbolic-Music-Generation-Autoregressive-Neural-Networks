# Fase 1: pré-treino no Pop1K7 (com Emotion_None e as curvas de energia/tensão).
# ~57M tokens com transposição: cerca de 3500 passos (~5 min na L40S) por época.
name: pretrain_large

data:
  train: pretrain_train
  val: pretrain_val

model:
  max_len: 1024
  d_model: 512
  n_layers: 6
  n_heads: 8
  d_ff: 2048
  dropout: 0.1
  tie_weights: true

train:
  stride: 512
  batch_size: 32
  lr: 3.0e-4
  min_lr_ratio: 0.1
  weight_decay: 0.1
  betas: [0.9, 0.95]
  warmup_steps: 2000
  max_epochs: 12
  patience: 3
  grad_clip: 1.0
  num_workers: 4
