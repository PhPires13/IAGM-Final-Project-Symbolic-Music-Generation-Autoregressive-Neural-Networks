[project]
name = "tp2-energia-tensao"
version = "0.1.0"
description = "Geração de piano (EMOPIA) com controle de energia e tensão por compasso: Transformer vs. Markov"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.5.1",
    "miditok>=3.0.4",
    "symusic>=0.5.0",
    "muspy>=0.5.0",
    "music21>=9.1.0",
    "pretty-midi>=0.2.10",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[tool.uv]
package = false

# Localmente (Linux/Windows) o torch vem do índice de CPU, para não baixar ~2,5 GB de
# bibliotecas CUDA. No cluster o torch vem do módulo pytorch/2.5.1-py3.10-cuda12.8.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
